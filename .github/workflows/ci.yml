name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INVENTORY_TEST_JDBC_URL: jdbc:postgresql://localhost:5433/business?currentSchema=inventory
      INVENTORY_TEST_USER: thesis
      INVENTORY_TEST_PASSWORD: thesis
      PAYMENT_TEST_JDBC_URL: jdbc:postgresql://localhost:5433/business?currentSchema=payment
      PAYMENT_TEST_USER: thesis
      PAYMENT_TEST_PASSWORD: thesis
      SHIPPING_TEST_JDBC_URL: jdbc:postgresql://localhost:5433/business?currentSchema=shipping
      SHIPPING_TEST_USER: thesis
      SHIPPING_TEST_PASSWORD: thesis
      VARIANT_A_TEST_JDBC_URL: jdbc:postgresql://localhost:5433/business
      VARIANT_A_TEST_USER: thesis
      VARIANT_A_TEST_PASSWORD: thesis
      TEMPORAL_TARGET: localhost:7233
      TEMPORAL_NAMESPACE: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start infra (Postgres + Temporal)
        run: |
          cd infra
          docker compose up -d
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U thesis -d business \
              && nc -z localhost 7233; then
              echo "infra ready"
              exit 0
            fi
            sleep 2
          done
          echo "infra not ready"
          docker compose ps
          docker compose logs --tail=80
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Stop infra
        if: always()
        run: cd infra && docker compose down

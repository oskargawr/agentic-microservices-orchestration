name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thesis
          POSTGRES_PASSWORD: thesis
          POSTGRES_DB: business
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U thesis -d business"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      INVENTORY_TEST_JDBC_URL: jdbc:postgresql://localhost:5433/business?currentSchema=inventory
      INVENTORY_TEST_USER: thesis
      INVENTORY_TEST_PASSWORD: thesis
      PAYMENT_TEST_JDBC_URL: jdbc:postgresql://localhost:5433/business?currentSchema=payment
      PAYMENT_TEST_USER: thesis
      PAYMENT_TEST_PASSWORD: thesis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

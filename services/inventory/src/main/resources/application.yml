server:
  port: 8081

spring:
  application:
    name: inventory
  datasource:
    url: jdbc:postgresql://localhost:5433/business?currentSchema=inventory
    username: thesis
    password: thesis
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: inventory
    default-schema: inventory
    create-schemas: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8082

spring:
  application:
    name: payment
  datasource:
    url: jdbc:postgresql://localhost:5433/business?currentSchema=payment
    username: thesis
    password: thesis
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    create-schemas: true
    locations: classpath:db/migration

# Deterministic fault simulation for experiments/tests (off by default)
thesis:
  payment:
    fault-injection-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
